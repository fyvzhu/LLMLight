# CoLLMLight 项目配置；所有相对路径以项目目录为基准。
output_root: ./outputs

training:
  random_seed: 42
  enable_ppo: true
  data_preparation: sample_and_generate # sample_and_generate / generate_teacher / reuse
  sft_source_run: null

inputs:
  traffic_samples: null # generate_teacher 必填；reuse 且启用 PPO 时必填
  teacher_data: null    # reuse 必填；其余模式忽略

sampling:
  max_steps: 3          # 0=完整仿真；正整数=采样决策步数

teacher_data:
  max_samples: 2        # 0=全部符合原版筛选条件的场景
  random_seed: 42

data:
  eval_ratio: 0.2
  ppo_eval_ratio: 0.1
  sft_require_ra_match: false

sft:
  lora:
    rank: 8
    alpha: 16
    dropout: 0.0
    target_modules: all-linear
  learning_rate: 0.0001
  num_epochs: 1
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  quantization_bits: 0
  per_device_batch_size: 1
  max_steps: 2          # -1=按 num_epochs 完整训练；正整数=更新次数上限
  logging_steps: 1
  save_strategy: steps
  eval_strategy: steps
  save_steps: 1
  best_metric: eval_loss
  greater_is_better: false

ppo:
  lora:
    rank: 8
    alpha: 16
    dropout: 0.0
    target_modules: auto
  learning_rate: 1.0e-05
  num_epochs: 2
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  quantization_bits: 4
  batch_size: 4         # TRL query 数量；每条交通记录展开为 ATR、RA 两项
  mini_batch_size: 2
  optimization_epochs: 1
  max_updates: 0
  max_samples: 4        # 0=全部具有历史观测的交通记录
  max_new_tokens: 1024
  temperature: 0.1
  top_k: 50
  top_p: 0.95
  whiten_rewards: true
  gpu_memory_utilization: 0.25

export:
  source: auto
  output_dir: null
  device: cpu
  dtype: auto
  validate: true
  auto_export: true

cityflow_test:
  model_path: null      # 可设置完整模型目录，或启动时指定 --run-dir
  backend: transformers
  port: 23333
  dataset: synthetic_4x4
  traffic_file: anon_4_4_synthetic_8000.json
  run_counts: 60
  max_new_tokens: 1024
  seed: 42
  disable_sr: false
  synchronous_sr: false
